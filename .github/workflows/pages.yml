name: Build and deploy Pages

on:
    push:
        branches: [main, master, ci/override-ga]
    workflow_dispatch:
        inputs:
            ref:
                description: "Branch or tag to build (defaults to the workflow ref)"
                required: false
                default: "main"

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # Use the manually provided ref when the workflow is triggered via workflow_dispatch
                  ref: ${{ github.event.inputs.ref || github.ref }}

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Enable Corepack (pnpm)
              run: corepack enable

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build (production)
              run: pnpm run build:gh

            - name: Upload Pages build
              uses: actions/upload-pages-artifact@v1
              with:
                  path: build/online-meeting-list

    deploy:
        needs: build-and-deploy
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write

        steps:
            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v1
